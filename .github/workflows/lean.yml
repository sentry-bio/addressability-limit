name: Lean

on:
  push:
    paths:
      - "theory/lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "theory/lean/**"
      - ".github/workflows/lean.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            theory/lean/.lake
          key: ${{ runner.os }}-lean4-${{ hashFiles('theory/lean/lean-toolchain', 'theory/lean/lake-manifest.json') }}

      - name: Build
        working-directory: theory/lean
        run: lake build
